# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "Agent Reliability"
slug: "agent-reliability"

runtime: python
entry: "src/server.py"

build:
  install: "pip install ."

start:
  type: stdio
  command: "python"
  args:
    - "-m"
    - "src.server"

bridge:
  mode: stdio
